[package]
name = "kittyai-desktop"
version = "1.0.0"
description = "KittyAI Autonomous Personal Assistant for Windows"
authors = ["KittyAI Team"]
edition = "2021"

[lib]
name = "kittyai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
